<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jordan Smith Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }
      body {
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0;
        padding: 0 4vw;
        font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
        font-weight: 700;
        font-size: clamp(1.5rem, 7vw, 6rem);
        letter-spacing: 0.01em;
        /* Jost's outlines overlap inside some letters: a 2px stroke under a black fill shows only its outer 1px. */
        color: #000;
        -webkit-text-stroke: 2px #fff;
        paint-order: stroke fill;
      }
    </style>
  </head>
  <body>
    <h1>JORDANSMITHDIGITAL</h1>
  </body>
</html>
